name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install deps
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Build web
        working-directory: app
        run: npm run build
      - name: Lint source
        working-directory: app
        run: npx eslint -c eslint.config.js "src/**/*.{js,jsx}"
      - name: Verify web build
        working-directory: app
        run: |
          test -f dist/index.html
          grep -q 'id="boot"' dist/index.html
          grep -q '__diskdriveShowError' dist/index.html
          node --check dist/assets/index-*.js
          ls -la dist
      - name: Sync Capacitor
        working-directory: app
        run: npx cap sync android
      - name: Verify Android assets
        working-directory: app
        run: |
          test -f android/app/src/main/assets/public/index.html
          grep -q 'id="boot"' android/app/src/main/assets/public/index.html
          grep -q '__diskdriveShowError' android/app/src/main/assets/public/index.html
          ls -la android/app/src/main/assets/public
      - name: Build APK
        working-directory: app/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Rename APK
        run: |
          mkdir -p out
          cp app/android/app/build/outputs/apk/debug/app-debug.apk out/DISKDRIVE-V1.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DISKDRIVE-V1
          path: out/DISKDRIVE-V1.apk
