<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>DiskDrive</title>
    <style>
      html,body,#root{margin:0;min-height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
      #boot{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:#000;color:#fff}
      #boot .box{max-width:560px;width:100%}
      #boot .logo{font-size:28px;font-weight:800;letter-spacing:2px;margin-bottom:12px}
      #boot .msg{color:#ddd;font-size:14px;line-height:1.5}
      #boot .err{white-space:pre-wrap;word-break:break-word;text-align:left;background:#111;border:1px solid #333;padding:12px;border-radius:12px;color:#fff;font-size:12px;margin-top:16px;max-height:45vh;overflow:auto;display:none}
      #boot button{margin-top:16px;background:#fff;color:#000;border:0;padding:12px 16px;border-radius:12px;font-weight:700;font-size:14px;display:none}
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="box">
        <div class="logo">DISKDRIVE</div>
        <div class="msg" id="boot-msg">Loading…</div>
        <div id="boot-err" class="err"></div>
        <button id="boot-reload" onclick="location.reload()">Reload</button>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (function(){
        var shown=false;
        function setMsg(msg){ var m=document.getElementById('boot-msg'); if(m) m.textContent=String(msg||''); }
        function showError(msg){
          if(shown) return; shown=true;
          var boot=document.getElementById('boot'); if(boot) boot.style.display='flex';
          setMsg('Startup error. Screenshot this and share it.');
          var e=document.getElementById('boot-err'); if(e){ e.style.display='block'; e.textContent=String(msg||'Unknown startup error'); }
          var b=document.getElementById('boot-reload'); if(b) b.style.display='inline-block';
        }
        window.__diskdriveBootStatus = setMsg;
        window.__diskdriveShowError = showError;
        window.__diskdriveHideBoot = function(){ var boot=document.getElementById('boot'); if(boot) boot.style.display='none'; };
        window.addEventListener('error', function(ev){ showError(ev.error && ev.error.stack ? ev.error.stack : (ev.message || 'Script error')); });
        window.addEventListener('unhandledrejection', function(ev){ var r=ev.reason; showError(r && r.stack ? r.stack : (r && r.message ? r.message : String(r))); });
        setTimeout(function(){ if(!window.__diskdriveFirstScreen) setMsg('Starting is taking too long… still loading.'); }, 5000);
        setTimeout(function(){ if(!window.__diskdriveFirstScreen) showError('App did not reach first screen. Last step: ' + (document.getElementById('boot-msg')?.textContent || 'unknown')); }, 15000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
